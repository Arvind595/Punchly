<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punchly | Minimalist Time Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="assets/logo.svg" alt="Punchly Logo" class="logo">
            <h1>Punchly</h1>
        </div>
        <div class="controls">
            <button id="themeToggle" class="btn-icon" aria-label="Toggle Theme">🌓</button>
        </div>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn active" data-target="today-view">Today</button>
        <button class="tab-btn" data-target="history-view">History & Analytics</button>
    </nav>

    <main class="content-area">
        <!-- TODAY VIEW -->
        <section id="today-view" class="tab-pane active">
            <div class="card matte-panel">
                <div class="settings-row">
                    <label for="targetShift">Target Shift Time:</label>
                    <input type="time" id="targetShift" value="08:20" class="matte-input">
                </div>
                
                <div class="punch-grid">
                    <div class="punch-group">
                        <label>Morning In</label>
                        <div class="input-wrapper">
                            <input type="time" id="morningIn" class="matte-input punch-input">
                            <button class="btn-now" data-target="morningIn">Now</button>
                        </div>
                    </div>
                    <div class="punch-group">
                        <label>Lunch Out</label>
                        <div class="input-wrapper">
                            <input type="time" id="lunchOut" class="matte-input punch-input">
                            <button class="btn-now" data-target="lunchOut">Now</button>
                        </div>
                    </div>
                    <div class="punch-group">
                        <label>Lunch Return</label>
                        <div class="input-wrapper">
                            <input type="time" id="lunchReturn" class="matte-input punch-input">
                            <button class="btn-now" data-target="lunchReturn">Now</button>
                        </div>
                    </div>
                    <div class="punch-group">
                        <label>Evening Out</label>
                        <div class="input-wrapper">
                            <input type="time" id="eveningOut" class="matte-input punch-input">
                            <button class="btn-now" data-target="eveningOut">Now</button>
                        </div>
                    </div>
                </div>

                <div class="calculation-panel">
                    <div class="calc-result">
                        <span class="label">Target Out Time:</span>
                        <span id="targetOutDisplay" class="value highlight">--:--</span>
                    </div>
                    <div class="calc-result">
                        <span class="label">Total Worked Today:</span>
                        <span id="totalWorkedDisplay" class="value">0h 0m</span>
                    </div>
                    
                    <div class="progress-container">
                        <div id="shiftProgressBar" class="progress-bar"></div>
                    </div>
                </div>

                <button id="saveDayBtn" class="btn-primary">Save Today's Record</button>
            </div>
        </section>

        <!-- HISTORY VIEW -->
        <section id="history-view" class="tab-pane">
            <div class="card matte-panel">
                <div class="history-controls">
                    <select id="timeRangeFilter" class="matte-input">
                        <option value="weekly">This Week</option>
                        <option value="monthly">This Month</option>
                        <option value="yearly">This Year</option>
                    </select>
                    <div class="export-group">
                        <button id="exportExcel" class="btn-secondary">Excel</button>
                        <button id="exportPDF" class="btn-secondary">PDF</button>
                        <button id="exportImage" class="btn-secondary">PNG</button>
                    </div>
                </div>

                <div class="chart-container" id="chartExportArea">
                    <canvas id="analyticsChart"></canvas>
                </div>

                <div class="table-container">
                    <table id="historyTable" class="minimal-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>In</th>
                                <th>Out</th>
                                <th>Total Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts loaded in order -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/export.js"></script>
</body>
</html>
